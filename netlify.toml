# ============================================================================
#  The Russian Garden Gazette — Netlify configuration
#
#  >>> THIS IS THE ONLY FILE THAT NAMES THE CURRENT ISSUE. <<<
#
#  To publish a new issue: upload the new issue files, then change the
#  four issue numbers below. Nothing else needs editing.
#  index.html is a plain list of issues and never has to change.
# ============================================================================

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------- redirects --
# force = true is REQUIRED. Without it Netlify serves index.html instead of
# redirecting. 302 (temporary) is deliberate: a 301 is cached by browsers
# permanently and would keep sending readers to this issue forever.

[[redirects]]
  from = "/"
  to = "/issue-14-ru.html"
  status = 302
  force = true
  conditions = {Language = ["ru"]}

[[redirects]]
  from = "/"
  to = "/issue-14-en.html"
  status = 302
  force = true

# Permanent shortcuts that always resolve to the newest issue.
# Safe to print or share: /current never changes.
[[redirects]]
  from = "/current"
  to = "/issue-14-en.html"
  status = 302
  force = true

[[redirects]]
  from = "/current-ru"
  to = "/issue-14-ru.html"
  status = 302
  force = true

# ------------------------------------------------------------------ headers --

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/og-*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
