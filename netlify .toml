# ============================================================================
#  The Russian Garden Gazette — Netlify configuration
#
#  THE CURRENT ISSUE IS NAMED ONLY HERE AND IN index.html.
#  When you publish a new issue, change "12" to the new number below,
#  and change the same number in index.html.
# ============================================================================

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------- redirects --
# force = true is REQUIRED. Without it Netlify serves index.html instead of
# redirecting, and the root keeps showing whatever that old file points at.
# 302 (temporary) is deliberate: a 301 is cached by browsers permanently and
# would keep sending returning readers to this issue after the next appears.

[[redirects]]
  from = "/"
  to = "/issue-12-ru.html"
  status = 302
  force = true
  conditions = {Language = ["ru"]}

[[redirects]]
  from = "/"
  to = "/issue-12-en.html"
  status = 302
  force = true

# Permanent shortcuts that always resolve to the newest issue.
# Safe to print or share: /current never changes.
[[redirects]]
  from = "/current"
  to = "/issue-12-en.html"
  status = 302
  force = true

[[redirects]]
  from = "/current-ru"
  to = "/issue-12-ru.html"
  status = 302
  force = true

# ------------------------------------------------------------------ headers --

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Pages revalidate on every visit so corrections appear at once, and so a
# stale root page can never be served from a browser cache.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/og-*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
